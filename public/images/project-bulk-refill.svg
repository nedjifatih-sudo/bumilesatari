<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A241E" />
      <stop offset="50%" stop-color="#141C17" />
      <stop offset="100%" stop-color="#0D130F" />
    </linearGradient>
    <linearGradient id="oakWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8F6B4A" />
      <stop offset="50%" stop-color="#A67E58" />
      <stop offset="100%" stop-color="#785739" />
    </linearGradient>
    <linearGradient id="tubeGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#A7F3D0" stop-opacity="0.18" />
    </linearGradient>
  </defs>

  <!-- Architectural Dark Refill Station Interior -->
  <rect width="1600" height="900" fill="url(#darkBg)" />

  <!-- Subtle Architectural Grid -->
  <g stroke="#F4F1EA" stroke-opacity="0.06" stroke-width="1">
    <line x1="140" y1="0" x2="140" y2="900" />
    <line x1="1460" y1="0" x2="1460" y2="900" />
    <line x1="0" y1="120" x2="1600" y2="120" />
    <line x1="0" y1="680" x2="1600" y2="680" />
  </g>

  <!-- Top Steel Support Rail -->
  <rect x="180" y="110" width="1240" height="22" rx="6" fill="#2A332D" stroke="#445249" stroke-width="1.5" />

  <!-- 5 Gravity Bulk Dispenser Cylinders -->
  <!-- Cylinder 1: Beras Merah Organik -->
  <g transform="translate(240, 132)">
    <rect x="0" y="0" width="150" height="360" rx="16" fill="url(#tubeGlass)" stroke="#E7E5E4" stroke-opacity="0.35" stroke-width="2" />
    <rect x="8" y="80" width="134" height="272" rx="10" fill="#8C3B2B" fill-opacity="0.88" />
    <path d="M35 360 L115 360 L95 415 L55 415 Z" fill="#A8A29E" />
    <rect x="67" y="415" width="16" height="32" rx="4" fill="#57534E" />
    <!-- Pull Handle -->
    <line x1="75" y1="388" x2="128" y2="368" stroke="#D6D3D1" stroke-width="6" stroke-linecap="round" />
    <circle cx="132" cy="366" r="9" fill="#9A3412" />
    <!-- Label -->
    <rect x="22" y="140" width="106" height="62" rx="3" fill="#FBF9F5" />
    <text x="75" y="164" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1C1917">BERAS MERAH</text>
    <text x="75" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#57534E">CIANJUR · CURAH</text>
    <text x="75" y="194" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#14532D">RP 18.500 / KG</text>
  </g>

  <!-- Cylinder 2: Kacang Hijau -->
  <g transform="translate(460, 132)">
    <rect x="0" y="0" width="150" height="360" rx="16" fill="url(#tubeGlass)" stroke="#E7E5E4" stroke-opacity="0.35" stroke-width="2" />
    <rect x="8" y="110" width="134" height="242" rx="10" fill="#3F6212" fill-opacity="0.88" />
    <path d="M35 360 L115 360 L95 415 L55 415 Z" fill="#A8A29E" />
    <rect x="67" y="415" width="16" height="32" rx="4" fill="#57534E" />
    <line x1="75" y1="388" x2="128" y2="368" stroke="#D6D3D1" stroke-width="6" stroke-linecap="round" />
    <circle cx="132" cy="366" r="9" fill="#15803D" />
    <rect x="22" y="140" width="106" height="62" rx="3" fill="#FBF9F5" />
    <text x="75" y="164" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1C1917">KACANG HIJAU</text>
    <text x="75" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#57534E">DEMAK · LOKAL</text>
    <text x="75" y="194" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#14532D">RP 24.000 / KG</text>
  </g>

  <!-- Cylinder 3: Gula Kelapa Kristal -->
  <g transform="translate(680, 132)">
    <rect x="0" y="0" width="150" height="360" rx="16" fill="url(#tubeGlass)" stroke="#E7E5E4" stroke-opacity="0.35" stroke-width="2" />
    <rect x="8" y="60" width="134" height="292" rx="10" fill="#B45309" fill-opacity="0.88" />
    <path d="M35 360 L115 360 L95 415 L55 415 Z" fill="#A8A29E" />
    <rect x="67" y="415" width="16" height="32" rx="4" fill="#57534E" />
    <line x1="75" y1="388" x2="128" y2="368" stroke="#D6D3D1" stroke-width="6" stroke-linecap="round" />
    <circle cx="132" cy="366" r="9" fill="#D97706" />
    <rect x="22" y="140" width="106" height="62" rx="3" fill="#FBF9F5" />
    <text x="75" y="164" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1C1917">GULA KELAPA</text>
    <text x="75" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#57534E">BANYUMAS · ORGANIK</text>
    <text x="75" y="194" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#14532D">RP 32.000 / KG</text>
  </g>

  <!-- Cylinder 4: Oat Giling Utuh -->
  <g transform="translate(900, 132)">
    <rect x="0" y="0" width="150" height="360" rx="16" fill="url(#tubeGlass)" stroke="#E7E5E4" stroke-opacity="0.35" stroke-width="2" />
    <rect x="8" y="95" width="134" height="257" rx="10" fill="#D6C3A5" fill-opacity="0.9" />
    <path d="M35 360 L115 360 L95 415 L55 415 Z" fill="#A8A29E" />
    <rect x="67" y="415" width="16" height="32" rx="4" fill="#57534E" />
    <line x1="75" y1="388" x2="128" y2="368" stroke="#D6D3D1" stroke-width="6" stroke-linecap="round" />
    <circle cx="132" cy="366" r="9" fill="#9A3412" />
    <rect x="22" y="140" width="106" height="62" rx="3" fill="#FBF9F5" />
    <text x="75" y="164" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1C1917">OAT UTUH</text>
    <text x="75" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#57534E">TANPA KEMASAN</text>
    <text x="75" y="194" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#14532D">RP 38.000 / KG</text>
  </g>

  <!-- Cylinder 5: Biji Kopi Arabika -->
  <g transform="translate(1120, 132)">
    <rect x="0" y="0" width="150" height="360" rx="16" fill="url(#tubeGlass)" stroke="#E7E5E4" stroke-opacity="0.35" stroke-width="2" />
    <rect x="8" y="125" width="134" height="227" rx="10" fill="#452719" fill-opacity="0.94" />
    <path d="M35 360 L115 360 L95 415 L55 415 Z" fill="#A8A29E" />
    <rect x="67" y="415" width="16" height="32" rx="4" fill="#57534E" />
    <line x1="75" y1="388" x2="128" y2="368" stroke="#D6D3D1" stroke-width="6" stroke-linecap="round" />
    <circle cx="132" cy="366" r="9" fill="#15803D" />
    <rect x="22" y="140" width="106" height="62" rx="3" fill="#FBF9F5" />
    <text x="75" y="164" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1C1917">KOPI ARABIKA</text>
    <text x="75" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#57534E">FLORES · MEDIUM</text>
    <text x="75" y="194" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#14532D">RP 145.000 / KG</text>
  </g>

  <!-- Digital Tare Scale & Customer Glass Jars on Teak Counter -->
  <rect x="140" y="680" width="1320" height="46" rx="6" fill="url(#oakWood)" />
  <rect x="180" y="726" width="1240" height="174" fill="#121814" />

  <!-- Digital Tare Weighing Scale -->
  <rect x="635" y="636" width="240" height="44" rx="8" fill="#292524" stroke="#57534E" stroke-width="2" />
  <rect x="665" y="646" width="110" height="24" rx="3" fill="#052E16" />
  <text x="720" y="663" text-anchor="middle" font-family="monospace" font-size="14" fill="#4ADE80" font-weight="bold">0.850 kg</text>
  <text x="825" y="662" text-anchor="middle" font-family="monospace" font-size="10" fill="#A8A29E">TARE OK</text>

  <!-- Receiving Glass Jar on Scale -->
  <rect x="705" y="512" width="100" height="124" rx="16" fill="url(#tubeGlass)" stroke="#F5F5F4" stroke-opacity="0.5" stroke-width="2" />
  <path d="M711 575 Q755 560 799 575 L799 630 L711 630 Z" fill="#B45309" />
  <!-- Falling Grain Stream -->
  <line x1="755" y1="447" x2="755" y2="575" stroke="#F59E0B" stroke-width="5" stroke-dasharray="6 4" />
</svg>
