<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="linenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222925" />
      <stop offset="100%" stop-color="#141A17" />
    </linearGradient>
    <pattern id="beeswaxHex" width="40" height="40" patternUnits="userSpaceOnUse">
      <polygon points="20,2 38,12 38,28 20,38 2,28 2,12" fill="none" stroke="#D97706" stroke-width="1.2" stroke-opacity="0.45" />
    </pattern>
    <pattern id="linenWeave" width="12" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="6" x2="12" y2="6" stroke="#D6CEBE" stroke-width="1" stroke-opacity="0.25" />
      <line x1="6" y1="0" x2="6" y2="12" stroke="#D6CEBE" stroke-width="1" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#linenBg)" />

  <!-- Organic Cotton Drawstring Produce Bag (Left) -->
  <g transform="translate(150, 170)">
    <rect x="0" y="60" width="380" height="490" rx="22" fill="#EAE3D5" />
    <rect x="0" y="60" width="380" height="490" rx="22" fill="url(#linenWeave)" />
    <!-- Drawstring Channel -->
    <rect x="0" y="60" width="380" height="42" rx="10" fill="#DCD2C0" />
    <path d="M380 80 Q445 65 450 130 Q435 170 380 95" fill="none" stroke="#8C6D4F" stroke-width="6" />
    <!-- Botanical Indigo Block Print Stamp -->
    <rect x="70" y="190" width="240" height="240" rx="8" fill="#1E3A5F" fill-opacity="0.9" />
    <circle cx="190" cy="310" r="76" fill="none" stroke="#FBF9F5" stroke-width="2" stroke-opacity="0.7" />
    <path d="M190 245 C220 275, 220 345, 190 375 C160 345, 160 275, 190 245 Z" fill="#FBF9F5" fill-opacity="0.85" />
    <text x="190" y="475" text-anchor="middle" font-family="monospace" font-size="14" fill="#44403C">KATUN ORGANIK · TARA 18G</text>
    <text x="190" y="502" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1C1917">Pewarna Alami Tarum Indigo</text>
  </g>

  <!-- Beeswax Food Wrap Sheet (Right Overlapping) -->
  <g transform="translate(590, 230)">
    <rect x="0" y="0" width="450" height="340" rx="14" fill="#F59E0B" fill-opacity="0.88" />
    <rect x="0" y="0" width="450" height="340" rx="14" fill="url(#beeswaxHex)" />
    <rect x="45" y="85" width="360" height="170" rx="6" fill="#FBF9F5" />
    <text x="225" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1C1917">PEMBUNGKUS LILIN LEBAH</text>
    <text x="225" y="178" text-anchor="middle" font-family="monospace" font-size="13" fill="#78350F">DAMAR PINUS · MINYAK JOJOBA · KATUN</text>
    <text x="225" y="212" text-anchor="middle" font-family="monospace" font-size="12" fill="#14532D">PENGGANTI PLASTIK CLING WRAP (150x PAKAI)</text>
  </g>

  <!-- Woven Pandan Storage Roll (Bottom Right) -->
  <g transform="translate(630, 610)">
    <rect x="0" y="0" width="380" height="125" rx="16" fill="#8C6D4F" />
    <line x1="0" y1="42" x2="380" y2="42" stroke="#5C4430" stroke-width="2" />
    <line x1="0" y1="84" x2="380" y2="84" stroke="#5C4430" stroke-width="2" />
    <text x="190" y="68" text-anchor="middle" font-family="monospace" font-size="14" fill="#FBF9F5">ANYAMAN PANDAN PESISIR · KERAJINan SIRKULAR</text>
  </g>
</svg>
